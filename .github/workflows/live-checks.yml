name: live-checks
on:
  schedule: [{ cron: '0 5 * * *' }]
  workflow_dispatch: {}
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke -- smoke/urls.txt --osm -33.9366,18.4713
